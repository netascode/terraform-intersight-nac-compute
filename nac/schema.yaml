---
compute: include('compute', required=False)
defaults: any(required=False)
---
compute:
  intersight: include('intersight', required=False)
  servers: list(include('server'), required=False)

intersight:
  organizations: list(include('intersight_organizations'), required=False)

intersight_organizations:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  policies: include('intersight_organizations_policies', required=False)
  pools: include('intersight_organizations_pools', required=False)
  templates: include('intersight_organizations_templates', required=False)
  profiles: include('intersight_organizations_profiles', required=False)

intersight_organizations_policies:
  bios: list(include('intersight_organizations_policies_bios'), required=False)
  boot_order: list(include('intersight_organizations_policies_boot_order'), required=False)
  qualification: list(include('intersight_organizations_policies_qualification'), required=False)
  certificate_management: list(include('intersight_organizations_policies_certificate_management'), required=False)
  adapter_configuration: list(include('intersight_organizations_policies_adapter_configuration'), required=False)
  device_connector: list(include('intersight_organizations_policies_device_connector'), required=False)
  drive_security: list(include('intersight_organizations_policies_drive_security'), required=False)
  sd_card: list(include('intersight_organizations_policies_sd_card'), required=False)
  memory: list(include('intersight_organizations_policies_memory'), required=False)
  persistent_memory: list(include('intersight_organizations_policies_persistent_memory'), required=False)
  mac_sec: list(include('intersight_organizations_policies_mac_sec'), required=False)
  ethernet_adapter: list(include('intersight_organizations_policies_ethernet_adapter'), required=False)
  ethernet_network: list(include('intersight_organizations_policies_ethernet_network'), required=False)
  ethernet_network_control: list(include('intersight_organizations_policies_ethernet_network_control'), required=False)
  ethernet_network_group: list(include('intersight_organizations_policies_ethernet_network_group'), required=False)
  ethernet_qos: list(include('intersight_organizations_policies_ethernet_qos'), required=False)
  fibre_channel_adapter: list(include('intersight_organizations_policies_fibre_channel_adapter'), required=False)
  fibre_channel_network: list(include('intersight_organizations_policies_fibre_channel_network'), required=False)
  fibre_channel_qos: list(include('intersight_organizations_policies_fibre_channel_qos'), required=False)
  firmware: list(include('intersight_organizations_policies_firmware'), required=False)
  fc_zone: list(include('intersight_organizations_policies_fc_zone'), required=False)
  imc_access: list(include('intersight_organizations_policies_imc_access'), required=False)
  ipmi_over_lan: list(include('intersight_organizations_policies_ipmi_over_lan'), required=False)
  iscsi_adapter: list(include('intersight_organizations_policies_iscsi_adapter'), required=False)
  iscsi_boot: list(include('intersight_organizations_policies_iscsi_boot'), required=False)
  iscsi_static_target: list(include('intersight_organizations_policies_iscsi_static_target'), required=False)
  lan_connectivity: list(include('intersight_organizations_policies_lan_connectivity'), required=False)
  ldap: list(include('intersight_organizations_policies_ldap'), required=False)
  local_user: list(include('intersight_organizations_policies_local_user'), required=False)
  network_connectivity: list(include('intersight_organizations_policies_network_connectivity'), required=False)
  ntp: list(include('intersight_organizations_policies_ntp'), required=False)
  port: list(include('intersight_organizations_policies_port'), required=False)
  power: list(include('intersight_organizations_policies_power'), required=False)
  san_connectivity: list(include('intersight_organizations_policies_san_connectivity'), required=False)
  serial_over_lan: list(include('intersight_organizations_policies_serial_over_lan'), required=False)
  scrub: list(include('intersight_organizations_policies_scrub'), required=False)
  smtp: list(include('intersight_organizations_policies_smtp'), required=False)
  snmp: list(include('intersight_organizations_policies_snmp'), required=False)
  storage: list(include('intersight_organizations_policies_storage'), required=False)
  ssh: list(include('intersight_organizations_policies_ssh'), required=False)
  syslog: list(include('intersight_organizations_policies_syslog'), required=False)
  thermal: list(include('intersight_organizations_policies_thermal'), required=False)
  virtual_kvm: list(include('intersight_organizations_policies_virtual_kvm'), required=False)
  virtual_media: list(include('intersight_organizations_policies_virtual_media'), required=False)
  vlan: list(include('intersight_organizations_policies_vlan'), required=False)
  vsan: list(include('intersight_organizations_policies_vsan'), required=False)
  switch_control: list(include('intersight_organizations_policies_switch_control'), required=False)
  system_qos: list(include('intersight_organizations_policies_system_qos'), required=False)
  flow_control: list(include('intersight_organizations_policies_flow_control'), required=False)
  link_aggregation: list(include('intersight_organizations_policies_link_aggregation'), required=False)
  link_control: list(include('intersight_organizations_policies_link_control'), required=False)
  multicast: list(include('intersight_organizations_policies_multicast'), required=False)

intersight_organizations_policies_bios:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  bios_template: enum('AnalyticalDatabaseSystems-M5-Intel', 'AnalyticalDatabaseSystems-M5-Intel-Tpm', 'AnalyticalDatabaseSystems-M6-Intel', 'AnalyticalDatabaseSystems-M6-Intel-Tpm', 'AnalyticalDatabaseSystems-M7-Intel', 'AnalyticalDatabaseSystems-M7-Intel-Tpm', 'Analytics-M8-AMD', 'Analytics-M8-AMD-Tpm', 'AzureStack-M6-Intel', 'AzureStack-M6-Intel-Tpm', 'AzureStack-M7-Intel', 'AzureStack-M7-Intel-Tpm', 'ComputationIntensive-M6-AMD', 'ComputationIntensive-M6-AMD-Tpm', 'CPUIntensive-M6-Intel', 'CPUIntensive-M6-Intel-Tpm', 'CPUIntensive-M7-Intel', 'CPUIntensive-M7-Intel-Tpm', 'CPUIntensive-M8-AMD', 'CPUIntensive-M8-AMD-Tpm', 'DataAnalytics-M6-Intel', 'DataAnalytics-M6-Intel-Tpm', 'DataAnalytics-M7-Intel', 'DataAnalytics-M7-Intel-Tpm', 'EnergyEfficiency-M5-Intel', 'EnergyEfficiency-M5-Intel-Tpm', 'EnergyEfficiency-M6-AMD', 'EnergyEfficiency-M6-AMD-Tpm', 'EnergyEfficiency-M6-Intel', 'EnergyEfficiency-M6-Intel-Tpm', 'EnergyEfficient-M7-Intel', 'EnergyEfficient-M7-Intel-Tpm', 'EnergyEfficiency-M8-AMD', 'EnergyEfficiency-M8-AMD-Tpm', 'HighPerformanceComputing-M5-Intel', 'HighPerformanceComputing-M5-Intel-Tpm', 'HighPerformanceComputing-M6-AMD', 'HighPerformanceComputing-M6-AMD-Tpm', 'HighPerformanceComputing-M6-Intel', 'HighPerformanceComputing-M6-Intel-Tpm', 'HighPerformanceComputing-M7-Intel', 'HighPerformanceComputing-M7-Intel-Tpm', 'HPC-M8-AMD', 'HPC-M8-AMD-Tpm', 'IOIntensive-M6-AMD', 'IOIntensive-M6-AMD-Tpm', 'IOIntensive-M6-Intel', 'IOIntensive-M6-Intel-Tpm', 'IOIntensive-M8-AMD', 'IOIntensive-M8-AMD-Tpm', 'JavaApplicationServer-M5-Intel', 'JavaApplicationServer-M5-Intel-Tpm', 'LowLatency-M5-Intel', 'LowLatency-M5-Intel-Tpm', 'LowLatency-M6-AMD', 'LowLatency-M6-AMD-Tpm', 'LowLatency-M6-Intel', 'LowLatency-M6-Intel-Tpm', 'LowLatency-M7-Intel', 'LowLatency-M7-Intel-Tpm', 'LowLatency-M8-AMD', 'LowLatency-M8-AMD-Tpm', 'M5-amd-virtual', 'M5-amd-virtual-Tpm', 'M5-intel-virtual', 'M5-intel-virtual-Tpm', 'M6-amd-virtual', 'M6-amd-virtual-Tpm', 'M6-intel-analytical-db', 'M6-intel-analytical-db-Tpm', 'M6-intel-virtual', 'M6-intel-virtual-Tpm', 'MaximumPerformance-M5-Intel', 'MaximumPerformance-M5-Intel-Tpm', 'OnlineTransactionProcessing-M5-Intel', 'OnlineTransactionProcessing-M5-Intel-Tpm', 'RDBMS-M8-AMD', 'RDBMS-M8-AMD-Tpm', 'RelationalDatabaseSystems-M6-Intel', 'RelationalDatabaseSystems-M6-Intel-Tpm', 'RelationalDatabaseSystems-M7-Intel', 'RelationalDatabaseSystems-M7-Intel-Tpm', 'VDI-M6-AMD', 'VDI-M6-AMD-Tpm', 'Virtualization-M5-Intel', 'Virtualization-M5-Intel-Tpm', 'Virtualization-M6-AMD', 'Virtualization-M6-AMD-Tpm', 'Virtualization-M6-Intel', 'Virtualization-M6-Intel-Tpm', 'Virtualization-M7-Intel', 'Virtualization-M7-Intel-Tpm', 'Virtualization-M8-AMD', 'Virtualization-M8-AMD-Tpm', 'Virtualization-M8-Intel', 'Virtualization-M8-Intel-Tpm', required=False)

intersight_organizations_policies_certificate_management:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  certificates: list(include('intersight_organizations_policies_certificate_management_certificate'), required=False)

intersight_organizations_policies_certificate_management_certificate:
  certificate_type: enum('Imc', 'RootCa')
  name: str(required=False)
  pem_certificate: str(required=False)
  private_key: str(required=False)
  cert_type: enum('None', 'KMIPClient', required=False)
  enabled: bool(required=False)

intersight_organizations_policies_adapter_configuration:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  settings: list(include('intersight_organizations_policies_adapter_configuration_settings'), required=False)

intersight_organizations_policies_adapter_configuration_settings:
  slot_id: str()
  ethernet_settings: include('intersight_organizations_policies_adapter_configuration_ethernet_settings', required=False)
  fc_settings: include('intersight_organizations_policies_adapter_configuration_fc_settings', required=False)
  port_channel_settings: include('intersight_organizations_policies_adapter_configuration_port_channel_settings', required=False)
  physical_nic_mode_settings: include('intersight_organizations_policies_adapter_configuration_physical_nic_mode_settings', required=False)

intersight_organizations_policies_adapter_configuration_ethernet_settings:
  lldp_enabled: bool(required=False)

intersight_organizations_policies_adapter_configuration_fc_settings:
  fip_enabled: bool(required=False)

intersight_organizations_policies_adapter_configuration_port_channel_settings:
  enabled: bool(required=False)

intersight_organizations_policies_adapter_configuration_physical_nic_mode_settings:
  physical_nic_enabled: bool(required=False)

intersight_organizations_policies_device_connector:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  configuration_from_intersight_only: bool(required=False)

intersight_organizations_policies_sd_card:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  enable_os: bool(required=False)
  enable_diagnostics: bool(required=False)
  enable_drivers: bool(required=False)
  enable_huu: bool(required=False)
  enable_scu: bool(required=False)

intersight_organizations_policies_memory:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  dimm_blocklisting: bool(required=False)

intersight_organizations_policies_persistent_memory:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  management_mode: enum('configured-from-intersight', 'configured-locally', required=False)
  retain_namespaces: bool(required=False)
  goals: include('intersight_organizations_policies_persistent_memory_goals', required=False)
  local_security: include('intersight_organizations_policies_persistent_memory_local_security', required=False)
  logical_namespaces: list(include('intersight_organizations_policies_persistent_memory_namespace'), required=False)

intersight_organizations_policies_persistent_memory_goals:
  memory_mode_percentage: int(min=0, max=100, required=False)
  persistent_memory_type: enum('app-direct', 'app-direct-non-interleaved', 'mixed-mode', required=False)
  socket_id: str(required=False)

intersight_organizations_policies_persistent_memory_local_security:
  enabled: bool(required=False)
  secure_passphrase: str(required=False)

intersight_organizations_policies_persistent_memory_namespace:
  name: str()
  capacity: int(min=1, required=False)
  mode: enum('raw', 'sector', required=False)
  socket_id: str(required=False)
  socket_memory_id: str(required=False)

intersight_organizations_policies_mac_sec:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  cipher_suite: enum('GCM-AES-128', 'GCM-AES-256', 'GCM-AES-XPN-128', 'GCM-AES-XPN-256', required=False)
  confidentiality_offset: enum('CONF-OFFSET-0', 'CONF-OFFSET-30', 'CONF-OFFSET-50', required=False)
  include_icv_indicator: bool(required=False)
  key_server_priority: int(min=0, max=255, required=False)
  replay_window_size: int(min=0, required=False)
  sak_expiry_time: int(min=0, required=False)
  security_policy: enum('Should-secure', 'Must-secure', required=False)
  mac_sec_ea_pol: include('intersight_organizations_policies_mac_sec_ea_pol', required=False)
  primary_key_chain: include('intersight_organizations_policies_mac_sec_key_chain', required=False)
  fallback_key_chain: include('intersight_organizations_policies_mac_sec_key_chain', required=False)

intersight_organizations_policies_mac_sec_ea_pol:
  ea_pol_ethertype: str(required=False)
  ea_pol_mac_address: regex('^[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}$', required=False)

intersight_organizations_policies_mac_sec_key_chain:
  name: str()
  keys: list(include('intersight_organizations_policies_mac_sec_key'), required=False)

intersight_organizations_policies_mac_sec_key:
  id: str(required=False)
  cryptographic_algorithm: enum('AES_256_CMAC', 'AES_128_CMAC', required=False)
  key_type: enum('Type-0', 'Type-6', 'Type-7', required=False)
  octet_string: str(required=False)
  send_lifetime_unlimited: bool(required=False)

intersight_organizations_policies_drive_security:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  key_setting: include('intersight_organizations_policies_drive_security_key_setting', required=False)

intersight_organizations_policies_drive_security_key_setting:
  key_type: enum('Manual', 'Kmip', required=False)
  manual_key: include('intersight_organizations_policies_drive_security_manual_key', required=False)
  remote_key: include('intersight_organizations_policies_drive_security_remote_key', required=False)

intersight_organizations_policies_drive_security_manual_key:
  existing_key: str(required=False)
  new_key: str(required=False)

intersight_organizations_policies_drive_security_remote_key:
  existing_key: str(required=False)
  server_certificate: str(required=False)
  auth_credentials: include('intersight_organizations_policies_drive_security_auth_credentials', required=False)
  primary_server: include('intersight_organizations_policies_drive_security_kmip_server', required=False)
  secondary_server: include('intersight_organizations_policies_drive_security_kmip_server', required=False)

intersight_organizations_policies_drive_security_auth_credentials:
  use_authentication: bool(required=False)
  username: str(required=False)
  password: str(required=False)

intersight_organizations_policies_drive_security_kmip_server:
  ip_address: str(required=False)
  port: int(min=1, max=65535, required=False)
  timeout: int(min=1, required=False)
  enable_drive_security: bool(required=False)

intersight_organizations_policies_boot_order:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  boot_mode: enum('Uefi', 'Legacy', required=False)
  secure_boot: bool(required=False)
  boot_devices: list(include('intersight_organizations_policies_boot_order_devices'), required=False)

intersight_organizations_policies_boot_order_devices:
  name: regex('^[a-zA-Z0-9_-]{1,30}$')
  device_type: enum('flex_mmc', 'http_boot', 'iscsi_boot', 'local_cdd', 'local_disk', 'nvme', 'pch_storage', 'pxe_boot', 'san_boot', 'sd_card', 'uefi_shell', 'usb', 'virtual_media')
  enabled: bool(required=False)
  slot: str(required=False)
  lun: int(min=0, max=255, required=False)
  subtype: enum('None', 'flex-util', 'flex-flash', 'SDCARD', 'cimc-mapped-dvd', 'cimc-mapped-hdd', 'kvm-mapped-dvd', 'kvm-mapped-hdd', 'kvm-mapped-fdd', 'usb-cd', 'usb-fdd', 'usb-hdd', 'flexmmc-mapped-dvd', 'flexmmc-mapped-hdd', required=False)
  interface_name: str(required=False)
  interface_source: enum('name', 'mac', 'port', required=False)
  ip_type: enum('None', 'IPv4', 'IPv6', required=False)
  ip_config_type: enum('DHCP', 'Static', required=False)
  mac_address: str(required=False)
  port: int(min=-1, max=255, required=False)
  protocol: enum('HTTP', 'HTTPS', required=False)
  target_wwpn: str(required=False)
  uri: str(required=False)
  ipv4_config: include('intersight_organizations_policies_boot_order_devices_ipv4', required=False)
  ipv6_config: include('intersight_organizations_policies_boot_order_devices_ipv6', required=False)
  bootloader: include('intersight_organizations_policies_boot_order_devices_bootloader', required=False)

intersight_organizations_policies_boot_order_devices_bootloader:
  name: str()
  path: str()
  description: str(required=False)

intersight_organizations_policies_boot_order_devices_ipv4:
  ip: ip(version=4)
  network_mask: str()
  gateway_ip: ip(version=4)
  dns_ip: ip(version=4, required=False)

intersight_organizations_policies_boot_order_devices_ipv6:
  ip: ip(version=6)
  prefix_length: int(min=1, max=128)
  gateway_ip: ip(version=6)
  dns_ip: ip(version=6, required=False)

intersight_organizations_policies_qualification:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  qualifiers: list(include('intersight_organizations_policies_qualification_qualifiers'), required=False)

intersight_organizations_policies_qualification_qualifiers:
  qualifier_type: enum('rack_server', 'blade_server', 'chassis_servers')
  asset_tags: list(str(), required=False)
  pids: list(str(), required=False)
  user_labels: list(str(), required=False)
  rack_id_range: list(include('intersight_organizations_policies_qualification_qualifiers_range'), required=False)
  chassis_pids: list(str(), required=False)
  chassis_and_slot_id_range: list(include('intersight_organizations_policies_qualification_qualifiers_chassis_slot'), required=False)
  slot_ids: list(int(), required=False)

intersight_organizations_policies_qualification_qualifiers_range:
  min: int(required=False)
  max: int(required=False)

intersight_organizations_policies_qualification_qualifiers_chassis_slot:
  chassis_id_range: include('intersight_organizations_policies_qualification_qualifiers_range', required=False)
  slot_id_ranges: list(include('intersight_organizations_policies_qualification_qualifiers_range'), required=False)

intersight_organizations_policies_ethernet_adapter:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
  description: str(required=False)
  managed: bool(required=False)
  tags: list(include('intersight_tag'), required=False)
  advanced_filter: bool(required=False)
  ether_channel_pinning: bool(required=False)
  geneve: bool(required=False)
  interrupt_scaling: bool(required=False)
  rss: bool(required=False)
  uplink_failback_timeout: int(min=0, max=600, required=False)
  arfs: bool(required=False)
  completion_queue_settings: include('intersight_organizations_policies_ethernet_adapter_completion_queue_settings', required=False)
  interrupt_settings: include('intersight_organizations_policies_ethernet_adapter_interrupt_settings', required=False)
  nvgre: bool(required=False)
  ptp: bool(required=False)
  roce_settings: include('intersight_organizations_policies_ethernet_adapter_roce_settings', required=False)
  rss_hash_settings: include('intersight_organizations_policies_ethernet_adapter_rss_hash_settings', required=False)
  rx_queue_settings: include('intersight_organizations_policies_ethernet_adapter_rx_queue_settings', required=False)
  tcp_offload_settings: include('intersight_organizations_policies_ethernet_adapter_tcp_offload_settings', required=False)
  tx_queue_settings: include('intersight_organizations_policies_ethernet_adapter_tx_queue_settings', required=False)
