intersight_organizations_policies_ethernet_adapter_completion_queue_settings:
  completion_queue_count: int(min=1, max=2000, required=False)
  ring_size: int(min=1, max=256, required=False)

intersight_organizations_policies_ethernet_adapter_interrupt_settings:
  coalescing_time: int(min=0, max=65535, required=False)
  coalescing_type: enum('MIN', 'IDLE', required=False)
  interrupt_count: int(min=1, max=1024, required=False)
  mode: enum('MSIx', 'MSI', 'INTx', required=False)

intersight_organizations_policies_ethernet_adapter_roce_settings:
  enabled: bool(required=False)
  cos: enum(1, 2, 4, 5, 6, required=False)
  memory_regions: int(min=1, max=524288, required=False)
  queue_pairs: int(min=1, max=8192, required=False)
  resource_groups: int(min=1, max=128, required=False)
  version: int(min=1, max=2, required=False)

intersight_organizations_policies_ethernet_adapter_rss_hash_settings:
  ipv4_hash: bool(required=False)
  ipv6_ext_hash: bool(required=False)
  ipv6_hash: bool(required=False)
  tcp_ipv4_hash: bool(required=False)
  tcp_ipv6_ext_hash: bool(required=False)
  tcp_ipv6_hash: bool(required=False)
  udp_ipv4_hash: bool(required=False)
  udp_ipv6_hash: bool(required=False)

intersight_organizations_policies_ethernet_adapter_rx_queue_settings:
  rx_queue_count: int(min=1, max=1000, required=False)
  ring_size: int(min=64, max=4096, required=False)

intersight_organizations_policies_ethernet_adapter_tcp_offload_settings:
  large_receive: bool(required=False)
  large_send: bool(required=False)
  rx_checksum: bool(required=False)
  tx_checksum: bool(required=False)

intersight_organizations_policies_ethernet_adapter_tx_queue_settings:
  tx_queue_count: int(min=1, max=1000, required=False)
  ring_size: int(min=64, max=4096, required=False)

intersight_organizations_policies_ethernet_network:
  name: regex('^[a-zA-Z0-9_.:-]{1,64}$')
